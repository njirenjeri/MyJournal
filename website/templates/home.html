{% extends "base.html" %} {% block title %}Home{% endblock %} {% block content
%}
<h1 align="center" class="mt-5">My Notes</h1>
<ul class="list-group list-group-flush" id="notes">
    {% for note in user.notes %}
    <li class="list-group-item">{{note.data}}
        <button type="button" class="close border border-0 bg-transparent" onclick="deleteNote({{ note.id}})">
            <span aria-hidden="true">&times;</span>
        </button>
    </li>
    {% endfor%}
</ul>
<form method="POST" class="mt-4">
    <textarea name="note" id="note" class="form-control"></textarea>
    <div align="center">
        <button type="submit" class="btn btn-primary mt-2">Add Note</button>
    </div>
</form>
{% endblock %}
